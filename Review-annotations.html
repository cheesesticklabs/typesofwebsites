<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cheesestick Labs · Review annotations</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2f6;color:#24384d;font:15px/1.5 Arial,sans-serif}header{background:#243b53;color:white;padding:24px 30px}h1{font-size:25px;margin:0 0 6px}header p{margin:0;color:#d3deea}.shell{max-width:1500px;margin:auto;padding:24px}.loaders{display:flex;gap:14px;align-items:end;flex-wrap:wrap;background:white;border:1px solid #d3dce7;border-radius:12px;padding:18px;margin-bottom:16px}label{font-size:13px;font-weight:bold;display:block}input{display:block;padding:10px;border:1px solid #b6c5d4;border-radius:6px;min-width:280px;margin-top:5px}input[type=file]{min-width:0;padding:7px}button,.download{padding:10px 15px;background:#2869a9;color:white;border:0;border-radius:7px;cursor:pointer;font:700 13px Arial;display:inline-block;text-decoration:none}button.secondary{background:#edf3f7;color:#24384d;border:1px solid #bfccda}button:disabled{opacity:.5;cursor:wait}#status{min-height:25px;margin-bottom:15px}#summary{font-size:18px;margin:14px 0}#sites{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}#sites button{background:white;color:#24384d;border:1px solid #c4d0dc}#sites button[aria-pressed=true]{background:#2869a9;color:white}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}.image-panel,aside,.answers{background:white;border:1px solid #ccd8e4;border-radius:10px;padding:16px}.image-toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:13px}.image-toolbar span{font-size:12px;color:#61758b}.image-scroll{overflow:auto;max-height:85vh;background:#f3f5f7}.image-stage{position:relative;width:100%;max-width:100%;margin:auto;line-height:0}.image-stage img{display:block;width:100%;height:auto}.image-stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.image-stage.original{max-width:none}aside{position:sticky;top:12px;max-height:90vh;overflow:auto}aside h2{font-size:18px;margin:0 0 14px}.comment{border:1px solid #ccd8e4;border-radius:8px;padding:12px;margin:0 0 11px;cursor:pointer}.comment.selected{outline:3px solid #e1b839}.comment h3{font-size:14px;margin:0 0 7px}.comment p{white-space:pre-wrap;font-size:13px;margin:8px 0 0}.comment small{color:#60758b}.meta{font-size:12px;color:#61758b;margin-top:12px;overflow-wrap:anywhere}.answers{margin-top:20px}.answers h2{font-size:19px}.answers h3{font-size:14px}.answers p{white-space:pre-wrap;font-size:14px}.empty{padding:30px;text-align:center;color:#64788c}[hidden]{display:none!important}@media(max-width:900px){.workspace{grid-template-columns:1fr}aside{position:static;max-height:none}.shell{padding:14px}header{padding:20px}input{min-width:220px}}
</style></head><body><header><h1>Cheesestick Labs · Review annotations</h1><p>Open a submission’s frozen pages and match each numbered pin to its comment.</p></header><main class="shell"><section class="loaders"><div><label for="submission-id">Firebase confirmation ID</label><input id="submission-id" placeholder="Paste the submission confirmation ID"></div><button id="load-firebase">Load submission</button><div><label for="record-file">Or open a downloaded annotated record</label><input id="record-file" type="file" accept=".json,application/json"></div></section><div id="status" role="status">Use a confirmation ID from this lab, or choose a student’s annotated-work JSON file.</div><div id="summary"></div><div id="sites"></div><section id="review" hidden><div class="workspace"><div class="image-panel"><div class="image-toolbar"><span id="dimensions"></span><div><button id="size-toggle" class="secondary">Original size</button> <a id="download-png" class="download">Download PNG</a></div></div><div class="image-scroll"><div class="image-stage" id="image-stage"><img id="page-image" alt="Frozen annotated page"><svg id="selection-ring" aria-hidden="true"></svg></div></div><p id="snapshot-meta" class="meta"></p></div><aside><h2>Numbered comments</h2><div id="comments"></div></aside></div><section class="answers"><h2>Written responses</h2><div id="answers"></div></section></section></main><script>
const FIREBASE_CONFIG={apiKey:'AIzaSyBC9ecOEOh4WREBs6jrqRELyh-WuJyFFv8',authDomain:'learnball-25d68.firebaseapp.com',projectId:'learnball-25d68',storageBucket:'learnball-25d68.firebasestorage.app',messagingSenderId:'690760987841',appId:'1:690760987841:web:91db39b17464a3dd1ed040'};
const COLLECTION='lesson_submissions';
let record=null,current=null,selected=null,original=false;
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function sha(s){return [...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(v=>v.toString(16).padStart(2,'0')).join('');}
async function openRecord(data){const snapshots=data.archive?.snapshots;if(!Array.isArray(snapshots))throw new Error('This file does not contain frozen annotation pages. Older submissions contain annotation data only.');for(const s of snapshots){if(!s.png?.dataUrl?.startsWith('data:image/png;base64,'))throw new Error('Missing PNG capture.');if(s.visualSha256&&await sha(s.png.dataUrl)!==s.visualSha256)throw new Error('The saved image checksum does not match.');}record=data;$('#summary').textContent=(data.studentName||'Student')+' · '+(data.classPeriod||'Class not specified');$('#sites').innerHTML=snapshots.map((s,i)=>`<button data-snapshot="${i}">${esc(s.siteId)} · ${esc(s.evidenceKey)}</button>`).join('');$('#sites').querySelectorAll('button').forEach(b=>b.onclick=()=>show(+b.dataset.snapshot));$('#answers').innerHTML=Object.entries(data.answers||{}).map(([key,value])=>`<h3>${esc(data.questionLabels?.[key]||key)}</h3><p>${esc(value||'(blank)')}</p>`).join('');if(snapshots.length)show(0);else{$('#review').hidden=true;$('#status').textContent='This submission has no annotations.';}$('#status').textContent=snapshots.length+' frozen annotated page(s) loaded. Image checksums verified.';}
function show(index){current=record.archive.snapshots[index];selected=null;original=false;$('#sites').querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));$('#review').hidden=false;$('#page-image').src=current.png.dataUrl;$('#image-stage').style.width='100%';$('#image-stage').classList.remove('original');$('#size-toggle').textContent='Original size';$('#selection-ring').setAttribute('viewBox',`0 0 ${current.viewport.width} ${current.viewport.height}`);$('#selection-ring').innerHTML='';$('#dimensions').textContent=`Original page: ${current.viewport.width} × ${current.viewport.height} CSS pixels · saved image: ${current.png.width} × ${current.png.height}`;$('#download-png').href=current.png.dataUrl;$('#download-png').download=current.siteId+'-annotated.png';$('#snapshot-meta').textContent=`Site version: ${current.siteVersion} · Captured: ${current.capturedAt} · Page content and pixel coordinates are included in the saved record.`;$('#comments').innerHTML=current.annotations.map(a=>`<section class="comment" data-comment-id="${a.id}" tabindex="0"><h3>#${a.id} · ${esc(a.type)} · ${esc(a.category||'No category')}</h3><small>${esc(a.label)}</small><p>${esc(a.comment||'(No comment)')}</p></section>`).join('');$('#comments').querySelectorAll('[data-comment-id]').forEach(card=>{card.onclick=()=>select(+card.dataset.commentId);card.onkeydown=e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();select(+card.dataset.commentId);}}});}
function select(id){selected=id;$('#comments').querySelectorAll('[data-comment-id]').forEach(c=>c.classList.toggle('selected',+c.dataset.commentId===id));const point=current.geometry.find(g=>g.id===id)?.pin;$('#selection-ring').innerHTML=point?`<circle cx="${point.x}" cy="${point.y}" r="24" fill="none" stroke="white" stroke-width="7"/><circle cx="${point.x}" cy="${point.y}" r="24" fill="none" stroke="#e1b839" stroke-width="4"/>`:'';}
$('#page-image').onclick=e=>{const r=e.target.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*current.viewport.width,y=(e.clientY-r.top)/r.height*current.viewport.height;const nearest=current.geometry.filter(g=>g.pin).map(g=>({id:g.id,d:Math.hypot(g.pin.x-x,g.pin.y-y)})).sort((a,b)=>a.d-b.d)[0];if(nearest&&nearest.d<40){select(nearest.id);$('#comments').querySelector(`[data-comment-id="${nearest.id}"]`)?.scrollIntoView({block:'nearest'});}};
$('#size-toggle').onclick=()=>{original=!original;$('#image-stage').classList.toggle('original',original);$('#image-stage').style.width=original?current.viewport.width+'px':'100%';$('#size-toggle').textContent=original?'Fit to window':'Original size';};
$('#record-file').onchange=async e=>{try{const file=e.target.files[0];if(file)await openRecord(JSON.parse(await file.text()));}catch(err){$('#status').textContent=err.message;}};
$('#load-firebase').onclick=async()=>{const id=$('#submission-id').value.trim();if(!/^[A-Za-z0-9_-]{1,128}$/.test(id)){$('#status').textContent='Enter a valid confirmation ID.';return;}const button=$('#load-firebase');button.disabled=true;$('#status').textContent='Loading saved submission and frozen pages…';try{const [{initializeApp,getApps},{getFirestore,doc,getDoc}]=await Promise.all([import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js')]);const app=getApps().find(a=>a.name==='annotation-review')||initializeApp(FIREBASE_CONFIG,'annotation-review'),db=getFirestore(app),root=await getDoc(doc(db,COLLECTION,id));if(!root.exists())throw new Error('Submission not found.');const data=root.data();if(!Array.isArray(data.annotationArchive))throw new Error('This older submission has no frozen-page archive.');const snapshots=await Promise.all(data.annotationArchive.map(async m=>{const meta=await getDoc(doc(db,COLLECTION,id,'annotationSnapshots',m.id));if(!meta.exists())throw new Error('A saved page is missing.');const spec=meta.data();const parts=await Promise.all(Array.from({length:spec.chunkCount},(_,i)=>getDoc(doc(db,COLLECTION,id,'annotationSnapshots',m.id,'chunks',String(i).padStart(4,'0')))));if(parts.some(x=>!x.exists()))throw new Error('A saved page chunk is missing.');const encoded=parts.map(x=>x.data().data).join(''),bytes=Uint8Array.from(atob(encoded),x=>x.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes));}));await openRecord({...data,archive:{snapshots}});}catch(err){$('#status').textContent=err.code==='permission-denied'?'Firebase denied read access. Use the student’s downloaded annotated record, or configure authenticated teacher access.':err.message;}finally{button.disabled=false;}};
</script></body></html>
