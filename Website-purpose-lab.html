window.FixSite=(()=>{

 const discussion=document.querySelector('#discussion-frame');if(discussion&&sites[state.discussionSite]){discussion.onload=()=>{const d=discussion.contentDocument;discussion.style.height=Math.max(600,d.body.scrollHeight)+'px';d.addEventListener('click',e=>e.preventDefault(),true);};discussion.srcdoc=WebAnnotator.source(state.discussionSite,sites[state.discussionSite],c);}
 FixSite.bind(c);document.querySelectorAll('[data-match]').forEach(x=>x.onchange=()=>{state.answers['match'+x.dataset.match]=x.value;persist()});document.querySelector('#check-match')?.addEventListener('click',()=>{const score=cats.filter((v,i)=>state.answers['match'+i]===v).length;document.querySelector('#match-feedback').textContent=score===4?tr('4/4. Explain one choice to your partner.','4/4. Explica una opción a tu compañero.'):tr(`${score}/4. Review the definitions and try again.`,`${score}/4. Repasa las definiciones y vuelve a intentar.`)});

function exportLines({state,tr}){return [tr('CSSA matches & changes','Relaciones y cambios CSSA'),JSON.stringify({matches:Object.fromEntries(Object.entries(state.answers).filter(([k])=>k.startsWith('match'))),changes:state.fix}),tr('Selected investigation site: ','Sitio seleccionado: ')+sites[state.selectedSite].name,...Object.entries(state.evidence||{}).flatMap(([id,as])=>[id,...as.map(a=>`#${a.id} [${a.type}] ${a.label} (${a.category||'—'}): ${a.comment}${a.pin?' [pin: '+JSON.stringify(a.pin)+']':''}${a.start?' [start: '+JSON.stringify(a.start)+']':''}${a.end?' [end: '+JSON.stringify(a.end)+']':''}`)])]}
function printEvidence({state,tr,esc,blank}){return `<section><h2>${tr('Annotation evidence','Evidencia anotada')}</h2>${blank?`<p>${tr('For each annotation: site, number, feature, CSSA category, and how it supports the purpose.','Para cada anotación: sitio, número, característica, categoría CSSA y cómo apoya el propósito.')}</p>`:exportLines({state,tr}).map(x=>`<p>${esc(x)}</p>`).join('')}</section>`}

})();

</script><script>

 function setDraft(){const el=$('#draft-status');el.classList.toggle('error',!storageOK);el.textContent=storageOK?tr('Draft saved in this browser','Borrador guardado en este navegador'):tr('Browser saving unavailable · download a backup','No se puede guardar · descarga una copia')}

 function mapSVG(kind='router'){
 const build=kind==='build',nodes=build?[['A',55,95],['B',230,35],['C',230,155],['D',400,95],['F',555,95]]:[['A',55,95],['B',260,35],['C',260,155],['F',555,95]];

 function submission(){return `<div class="response-summary">${summary()}</div><div class="submit-fields"><div><label for="student-name">${tr('First and last name','Nombre y apellido')}</label><input id="student-name" autocomplete="name" value="${esc(state.name)}"></div><div><label for="student-period">${tr('Class / period','Clase / período')}</label><input id="student-period" value="${esc(state.period)}" maxlength="80"></div></div>${!L.firebase?`<div class="preview-notice">${tr('Online submission is not connected. Download your complete work and attach it where your teacher directs, or print it.','La entrega en línea no está conectada. Descarga el trabajo completo y adjúntalo donde indique tu docente, o imprímelo.')}</div>`:''}<div class="submit-actions"><button class="primary" id="submit-work" ${!L.firebase||state.receipt?'disabled':''}>${state.receipt?tr('✓ Submitted','✓ Entregado'):tr('Submit my work →','Entregar mi trabajo →')}</button><button class="secondary" id="download-answers">${tr('↓ Download answers','↓ Descargar respuestas')}</button><button class="secondary" id="print-answers">${tr('Print / Save PDF','Imprimir / Guardar PDF')}</button></div><div class="submit-note ${state.receipt?'success':''}" id="submission-status" role="status">${state.receipt?tr('✓ Submitted successfully. Confirmation: ','✓ Entregado correctamente. Confirmación: ')+esc(state.receipt.id):tr('Not submitted. A saved browser draft is not a submission.','Sin entregar. Un borrador guardado en el navegador no es una entrega.')}</div>`}
 function render(focus=false){stopAnimation();const p=pages[state.page];if(!state.visited.includes(p.id))state.visited.push(p.id);renderChrome();let content='';if(p.kind==='submit')content=submission();else {content=learn(p);if(window.PurposeLab)content+=PurposeLab.render(p,{state,tr,text,esc,block});content+=(p.questions||[]).map(questionHTML).join('')+pause(p)}$('#lesson').innerHTML=shell(p,content);$$('[data-answer]').forEach(el=>el.addEventListener('input',()=>{state.answers[el.dataset.answer]=el.value;queueSave()}));$$('[data-term]').forEach(el=>{const key=el.dataset.term;const btn=document.createElement('button');btn.className='vocab-link';btn.type='button';btn.dataset.vocabTerm=key;btn.textContent=el.textContent;btn.setAttribute('aria-label',tr('Define ','Definir ')+el.textContent);el.replaceWith(btn);btn.onclick=()=>openVocabulary(key)});if($('#back'))$('#back').onclick=()=>go(state.page-1);if($('#next'))$('#next').onclick=()=>go(state.page+1);if(p.kind==='routes')bindRoutes();if(p.kind==='routers')bindRouters();if(window.PurposeLab)PurposeLab.bind(p,{state,tr,text,esc,persist,announce,render});if(p.kind==='submit')bindSubmit();persist();if(focus){$('#lesson').focus({preventScroll:true});window.scrollTo({top:Math.max(0,$('#page-nav').getBoundingClientRect().top+window.scrollY-15),behavior:reduced?'instant':'smooth'})}}
 function go(i){if(i<0||i>=pages.length)return;collect();persist();if(!canOpen(i)){pendingPage=i;const p=pages[i].checkpoint?pages[i]:[...pages.slice(0,i)].reverse().find(p=>p.checkpoint);if(!p)return;$('#checkpoint-question').textContent=text(p.checkpoint.question);$('#checkpoint-hint').textContent=text(p.checkpoint.hint);$('#checkpoint-answer').value='';$('#checkpoint-status').textContent='';$('#checkpoint').showModal();return}state.page=i;render(true)}
 $('#checkpoint-form').addEventListener('submit',e=>{e.preventDefault();if(pendingPage===null)return;const p=pages[pendingPage].checkpoint?pages[pendingPage]:[...pages.slice(0,pendingPage)].reverse().find(p=>p.checkpoint),guess=normalize($('#checkpoint-answer').value),master=L.masterAnswers.some(a=>normalize(a)===guess);if(master||p.checkpoint.answers.some(a=>normalize(a)===guess)){state.unlocked=Math.max(state.unlocked,master||wrapStart>=0&&pendingPage>=wrapStart?pages.length-1:pendingPage);const dest=pendingPage;pendingPage=null;$('#checkpoint').close();announce(master?tr('All pages unlocked.','Todas las páginas desbloqueadas.'):dest>=wrapStart&&wrapStart>=0?tr('Big Idea, Exit Ticket, and Submit unlocked.','Idea clave, Boleto de salida y Entrega desbloqueados.'):tr('Unlocked through page ','Desbloqueado hasta la página ')+(dest+1)+'.');go(dest)}else{$('#checkpoint-status').textContent=tr('Not quite. Check the spelling or ask your teacher for the answer.','Todavía no. Revisa la ortografía o pide la respuesta a tu docente.');$('#checkpoint-answer').select()}});
 function bindRoutes(){const update=()=>{const d=state.delay;$('#direct-total').textContent=d;$('#delay-output').textContent=d+' min';$('#route-via').classList.toggle('better',d>15);$('#route-direct').classList.toggle('better',d<15);$('#route-result').textContent=d===15?tr('A tie: both routes take 15 minutes.','Empate: ambas rutas tardan 15 minutos.'):d>15?tr('The route through B is faster by ','La ruta por B es más rápida por ')+(d-15)+tr(' minutes.',' minutos.'):tr('The direct route is faster by ','La ruta directa es más rápida por ')+(15-d)+tr(' minutes.',' minutos.')};$('#route-delay').oninput=e=>{state.delay=+e.target.value;update();queueSave()};$('#route-reset').onclick=()=>{state.delay=20;$('#route-delay').value=20;update();persist()};update()}
 async function animatePath(path,lookup,done){stopAnimation();const token=animationRun,dot=$('#moving-packet');if(!dot)return;dot.hidden=false;let elapsed=0,last=null,paused=false;const total=(path.length-1)*850;

 function bindRouters(){const update=()=>{$$('[data-edge]').forEach(el=>{const edge=el.dataset.edge,upper=edge==='AB'||edge==='BF';el.classList.toggle('closed',upper&&state.blocked);el.classList.toggle('active',state.blocked?!upper:upper)});$('#close-link').setAttribute('aria-pressed',String(state.blocked));$('#close-link').textContent=state.blocked?tr('Reopen upper connection','Reabrir conexión de arriba'):tr('Close upper connection','Cerrar conexión de arriba')};$('#close-link').onclick=()=>{stopAnimation();$('#moving-packet').hidden=true;$('#pause-message').disabled=true;$('#pause-message').textContent=tr('Pause','Pausar');$('#send-message').disabled=false;state.blocked=!state.blocked;update();$('#router-result').textContent=state.blocked?tr('Upper connection closed. Try sending again.','Conexión de arriba cerrada. Prueba a enviar otra vez.'):tr('Upper connection is open again.','La conexión de arriba está abierta otra vez.');persist()};$('#send-message').onclick=()=>{const path=state.blocked?['A','C','F']:['A','B','F'];$('#send-message').disabled=true;$('#router-result').textContent=tr('Traveling: ','En camino: ')+path.join(' → ');animatePath(path,{A:[55,95],B:[260,35],C:[260,155],F:[555,95]},()=>{$('#router-result').textContent=tr('✓ Delivered via ','✓ Entregado por ')+path.join(' → ')+'.';$('#send-message').disabled=false;$('#send-message').textContent=tr('↻ Send again','↻ Enviar otra vez');$('#pause-message').disabled=true;$('#pause-message').textContent=tr('Pause','Pausar')})};update()}
 function renderBuild(){if($('#test-route'))$('#test-route').disabled=false;if($('#moving-packet'))$('#moving-packet').hidden=true;const path=['A',...state.path,'F'];$('#drop-route').innerHTML=`<span>A →</span>${state.path.map((n,i)=>`<span class="path-stop"><button data-remove-stop="${i}" aria-label="${tr('Remove stop ','Quitar parada ')+n}">${n} ×</button> →</span>`).join('')}<span>F</span>`;$$('[data-remove-stop]').forEach(b=>b.onclick=()=>{stopAnimation();state.path.splice(+b.dataset.removeStop,1);renderBuild();persist()});$$('[data-stop]').forEach(b=>{b.setAttribute('aria-pressed',String(state.path.includes(b.dataset.stop)))});$$('[data-edge]').forEach(el=>el.classList.toggle('active',path.some((n,i)=>i>0&&path[i-1]+n===el.dataset.edge)));const c=pathCost();$('#build-result').textContent=c===null?tr('This path uses a connection that isn’t on the map. Try different stops.','Este camino usa una conexión que no aparece en el mapa. Prueba otras paradas.'):pathSummary()+' · '+c+' min';$('#test-history').innerHTML=state.tests.length?`<ol>${state.tests.map(t=>`<li class="history-row">${esc(t.path)} <span class="history-cost">· ${t.cost} min</span></li>`).join('')}</ol>`:`<p class="caption" style="margin-top:6px">${tr('No tests yet. Direct A → F is a valid first route.','Aún no hay pruebas. A → F directo es una primera ruta válida.')}</p>`}
 function addStop(n){if(state.path.includes(n)){announce(tr('That stop is already in your path.','Esa parada ya está en tu camino.'));return}stopAnimation();state.path.push(n);renderBuild();persist()}
 function bindBuild(){let drag=null,ghost=null,suppressClick=false;const slot=$('#drop-route');$$('[data-stop]').forEach(btn=>{btn.onclick=()=>{if(!suppressClick)addStop(btn.dataset.stop)};btn.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,n:btn.dataset.stop,moved:false};btn.setPointerCapture(e.pointerId)});btn.addEventListener('pointermove',e=>{if(!drag)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6)drag.moved=true;if(!drag.moved)return;if(!ghost){ghost=document.createElement('div');ghost.className='drag-ghost';ghost.textContent=drag.n;document.body.append(ghost)}ghost.style.left=e.clientX-20+'px';ghost.style.top=e.clientY-25+'px';const r=slot.getBoundingClientRect();slot.classList.toggle('over',e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)});const finish=e=>{if(!drag)return;if(drag.moved){const r=slot.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)addStop(drag.n);suppressClick=true;setTimeout(()=>suppressClick=false,0)}ghost?.remove();ghost=null;drag=null;slot.classList.remove('over')};btn.addEventListener('pointerup',finish);btn.addEventListener('pointercancel',()=>{ghost?.remove();ghost=null;drag=null;slot.classList.remove('over')})});$('#clear-route').onclick=()=>{stopAnimation();state.path=[];$('#moving-packet').hidden=true;$('#test-route').disabled=false;renderBuild();persist()};$('#test-route').onclick=()=>{const cost=pathCost();if(cost===null){announce(tr('Choose a path using the map’s connections.','Elige un camino usando las conexiones del mapa.'));return}const path=['A',...state.path,'F'],label=path.join(' → ');if(!state.tests.some(t=>t.path===label))state.tests.push({path:label,cost});state.tests=state.tests.slice(-12);persist();renderBuild();$('#test-route').disabled=true;animatePath(path,{A:[55,95],B:[230,35],C:[230,155],D:[400,95],F:[555,95]},()=>{$('#test-route').disabled=false;$('#build-result').textContent=tr  function renderVocabulary(){const keys=[...new Set(pages.filter(p=>state.visited.includes(p.id)).flatMap(p=>p.vocab||[]))];$('#vocab-count').textContent=keys.length;$('#vocab-list').innerHTML=keys.length?keys.map(k=>{const v=L.vocabulary[k],p=pages.find(p=>(p.vocab||[]).includes(k));return `<dt id="term-${k}">${esc(text(v.term))}</dt><dd>${esc(text(v.definition))}<div class="term-page">${esc(text(p.name))}</div></dd>`}).join(''):`<p class="muted">${tr('New terms will appear when you reach the first topic.','Los términos aparecerán cuando llegues al primer tema.')}</p>`}

 function printWork(blank){collect();persist();const sections=pages.filter(p=>p.questions?.length).map(p=>`<section><h2>${esc(text(p.name))} · ${esc(text(p.title))}</h2>${p.learn?`<p>${text(p.learn).replace(/<[^>]+>/g,'')}</p>`:''}${p.kind==='activity'?`<p>${tr('Connections (minutes): A–B 8, B–F 7, A–C 4, C–D 5, D–F 4, A–F 20.','Conexiones (minutos): A–B 8, B–F 7, A–C 4, C–D 5, D–F 4, A–F 20.')}</p>`:''}${p.kind==='routes'?`<p>A → B → F: 8 + 7 = 15 min. A → F: 20 min.</p>`:''}${p.questions.map((q,i)=>`<div class="print-question"><strong>${i+1}. ${esc(text(q.label))}</strong>${blank?'<div class="write-lines"></div>':`<p style="white-space:pre-wrap">${esc(state.answers[q.id]||tr('(blank)','(sin respuesta)'))}</p>`}</div>`).join('')}</section>`).join('');const evidence=PurposeLab.printEvidence({state,tr,esc,blank});$('#print-area').innerHTML=`<h1>${esc(text(L.title))}</h1><p>${blank?tr('Name: _____________________  Class: __________','Nombre: _____________________  Clase: __________'):esc(state.name)+' · '+esc(state.period)}</p>${sections}${evidence}`;window.print()}
 async function submit(){if(submitting||state.receipt||!L.firebase)return;collect();persist();const status=$('#submission-status');if(!state.name.trim()||!state.period.trim()){status.textContent=tr('Add your name and class before submitting.','Añade tu nombre y clase antes de entregar.');(state.name.trim()?$('#student-period'):$('#student-name')).focus();return}submitting=true;$('#submit-work').disabled=true;status.textContent=tr('Submitting to your teacher…','Entregando a tu docente…');try{const [{initializeApp,getApps},{getFirestore,doc,setDoc,serverTimestamp}]=await Promise.all([import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js')]);const app=getApps().find(a=>a.name===L.id)||initializeApp(L.firebase,L.id),db=getFirestore(app);state.submissionId||=crypto.randomUUID();persist();const ref=doc(db,L.collection,state.submissionId);await setDoc(ref,{lessonId:L.id,lessonTitle:text(L.title),studentName:state.name.trim(),classPeriod:state.period.trim(),language:state.lang,answers:state.answers,evidence:state.evidence,selectedSite:state.selectedSite,cssaChanges:state.fix,submittedAt:serverTimestamp()});state.receipt={id:ref.id,date:new Date().toISOString()};persist();render();announce(tr('Your work was submitted successfully.','Tu trabajo se entregó correctamente.'))}catch(error){if($('#submission-status'))$('#submission-status').textContent=tr('Submission did not complete. Your draft is still here. Download a backup and let your teacher know.','No se completó la entrega. Tu borrador sigue aquí. Descarga una copia y avisa a tu docente.');if($('#submit-work'))$('#submit-work').disabled=false}finally{submitting=false}}
